name: Release assets

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  release-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Obsidian release assets
        shell: bash
        run: |
          mkdir -p dist
          cp main.js manifest.json dist/
          if [ -f styles.css ]; then
            cp styles.css dist/
          fi

      - name: Attest main.js
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/main.js

      - name: Attest manifest.json
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/manifest.json

      - name: Attest styles.css
        if: ${{ hashFiles('dist/styles.css') != '' }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/styles.css

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-release-assets
          path: dist/*
